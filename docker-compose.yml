version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Overrides whatever .env says. `postgres` resolves only inside the
      # compose network, while DATABASE_URL defaults to localhost for a
      # developer running the API on the host. Without this override the
      # container would look for PostgreSQL inside itself.
      DATABASE_URL: postgresql+asyncpg://researchmind:researchmind@postgres:5432/researchmind
      # Same reason, for Redis. Since M3/S3.2 the API enqueues ingestion jobs to
      # it, so the localhost default would make every upload fail with 503.
      REDIS_HOST: redis
    depends_on:
      # Long form so `condition:` can be set. A bare `depends_on` list waits
      # only for the container to start, which for PostgreSQL means "the
      # process exists", not "it accepts connections" — the API would come up
      # first and fail its first query. `service_started` is what the list form
      # already meant for redis, so its behaviour is unchanged. Qdrant gained a
      # healthcheck in M3/S3.5 and now waits on it for the same reason
      # PostgreSQL does: the worker asserts the collection's dimension at
      # startup, and a Qdrant that has not opened its port yet would fail it.
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

  # The ingestion worker (ADR-0009): the backend image, running ARQ instead of
  # the API. It shares the upload volume, because it reads the stored PDFs, and
  # needs the same database and Redis the API writes to.
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: ["arq", "backend.ingestion.worker_settings.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://researchmind:researchmind@postgres:5432/researchmind
      REDIS_HOST: redis
      # Since M3/S3.5 the worker embeds and upserts, so it needs the vector
      # store by its compose hostname, and the weights the image already
      # carries — never a download while a document is waiting (ADR-0004 §2).
      QDRANT_HOST: qdrant
      EMBEDDING_CACHE_DIR: /app/.fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        # Build-time, not runtime: see Dockerfile.frontend. This URL is consumed
        # by the browser on the host, so it uses the published port rather than
        # the compose-internal hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    # The system of record (ADR-0003). Pinned to a major version: an unpinned
    # `latest` would silently move the on-disk data format under a named volume.
    image: postgres:16
    environment:
      # Development credentials, matching the DATABASE_URL default in
      # backend/config/settings.py. Not secrets, and not used anywhere else.
      POSTGRES_USER: researchmind
      POSTGRES_PASSWORD: researchmind
      POSTGRES_DB: researchmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are not optional here: a bare `pg_isready` reports ready
      # during the initdb phase, before the application database exists, so
      # `condition: service_healthy` would unblock the API too early.
      test: ["CMD-SHELL", "pg_isready -U researchmind -d researchmind"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The vector store (ADR-0003). Pinned, not `latest`: this one holds state,
  # and a collection built by one version being read by another is not
  # something a `docker compose pull` should decide. CI runs the same version.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant's image carries no curl, so this asks bash to open the port.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
