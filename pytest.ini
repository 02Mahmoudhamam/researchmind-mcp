[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    db: requires a reachable PostgreSQL. Skipped locally when DATABASE_URL is
        unreachable; REQUIRED in CI, where REQUIRE_DB=1 turns the skip into a
        failure so the coverage cannot quietly disappear.
    redis: requires a reachable Redis. Skipped locally when REDIS_HOST:REDIS_PORT
        is unreachable; REQUIRED in CI, where REQUIRE_REDIS=1 turns the skip into
        a failure.
    embeddings: requires the FastEmbed model's weights (~67 MB, cached or
        downloaded on first use). Skipped locally when they cannot be loaded;
        REQUIRED in CI, where REQUIRE_EMBEDDINGS=1 turns the skip into a
        failure.
    qdrant: requires a reachable Qdrant. Each test builds and drops its own
        collection. Skipped locally when Qdrant is unreachable; REQUIRED in CI,
        where REQUIRE_QDRANT=1 turns the skip into a failure.
