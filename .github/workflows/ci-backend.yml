# Backend CI — ENFORCED since Sprint M0/S0.5.
#
# Sprint M1/S1.1 added the `postgres:16` service container below and REQUIRE_DB=1.
# The connectivity work it introduced is only meaningful if it is verified
# somewhere other than a developer's machine — S0.5 found a repository that had
# been unclonable for four sprints precisely because its checks never left one.
#
# Promotion history (the schedule this file used to carry):
#   Sprint M0/S0.1  poetry check, poetry install, pytest   — now enforced
#   Milestone M0    ruff, black --check                    — now enforced
#   Milestone M2    mypy --strict                          — STILL DEFERRED
#
# mypy is deliberately absent below. It is configured and runnable (see
# [tool.mypy] in pyproject.toml, whose module-path defect was fixed in S0.5), but
# it reports 149 errors in 66 files, 54 of them `empty-body` — the ~99 stubs that
# declare a non-Optional return and then `...`. Those are the unimplemented
# system, not type bugs. Enforcing it now would mean a permanently red pipeline
# or blanket ignores; both teach people to ignore CI. It is promoted at M2, when
# auth is the first subsystem with real bodies to type-check.
name: Backend CI

on:
  push:
    branches: [main, "milestone/**", "sprint/**"]
  pull_request:
    branches: [main, "milestone/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Without this Poetry builds the venv under ~/.cache/pypoetry, so the cache
  # step below — which keys on .venv — would never hit.
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  backend:
    name: Lint, format, import and test
    runs-on: ubuntu-latest

    services:
      # The system of record (ADR-0003). Tests marked `db` run against a real
      # PostgreSQL and are never redirected to SQLite: the schema they will
      # carry uses JSONB, UUID and partial indexes, so a passing SQLite run
      # would say nothing about what ships.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: researchmind
          POSTGRES_PASSWORD: researchmind
          POSTGRES_DB: researchmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchmind -d researchmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://researchmind:researchmind@localhost:5432/researchmind
      # Turns "database unreachable" from a skip into a failure. A skipped test
      # reports success, so without this the database coverage could disappear
      # from CI and nothing would say so.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Validate pyproject
        run: poetry check

      - name: Validate lockfile is in step with pyproject
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (black)
        run: poetry run black --check .

      - name: Assert `import mcp` resolves to the SDK, not this repository
        run: |
          # ADR-0002, the runtime half of the guard in ci-hygiene.yml. That job
          # installs nothing, so it can only assert the repository invariant (no
          # top-level mcp/). This one has dependencies installed, so it asserts
          # what actually broke before S0.2: that `import mcp` lands in the
          # installed SDK rather than a repository-local package.
          poetry run python - <<'PY'
          import pathlib
          import mcp

          resolved = pathlib.Path(mcp.__file__).resolve()
          if "site-packages" not in resolved.parts:
              raise SystemExit(f"::error::import mcp resolved to {resolved}, not the installed SDK")
          print(f"OK: import mcp -> {resolved}")
          PY

      - name: Tests
        run: poetry run pytest -v
