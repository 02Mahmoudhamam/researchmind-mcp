# Backend CI — ENFORCED since Sprint M0/S0.5.
#
# Sprint M1/S1.1 added the `postgres:16` service container below and REQUIRE_DB=1.
# The connectivity work it introduced is only meaningful if it is verified
# somewhere other than a developer's machine — S0.5 found a repository that had
# been unclonable for four sprints precisely because its checks never left one.
#
# Promotion history (the schedule this file used to carry):
#   Sprint M0/S0.1  poetry check, poetry install, pytest   — now enforced
#   Milestone M0    ruff, black --check                    — now enforced
#   Milestone M2    mypy --strict                          — enforced, SCOPED (M2/S2.5)
#   Milestone M3    same gate, extended to upload & storage — M3/S3.1
#                   and to the ingestion worker            — M3/S3.2
#                   and to PDF text extraction             — M3/S3.3
#                   and to section-aware chunking          — M3/S3.4
#                   and to embeddings                      — M3/S3.5
#
# mypy is promoted at M2 as scheduled, but over the finished surface only — not
# the whole repository — and the scope is the honest part. `mypy .` still
# reports 104 errors, most of them `empty-body`: stubs in M4–M6 subsystems that
# declare a non-Optional return and then `...`. Those are the unimplemented
# system, not type bugs, and enforcing them would mean a permanently red
# pipeline or blanket ignores; both teach people to ignore CI.
#
# What *is* enforced: every file a finished sprint made real passes
# `mypy --strict` with no ignores — M2's authentication, authorisation,
# passwords, tokens, registration and login; since M3/S3.1 upload validation,
# content-addressed storage, the ingestion boundary and the document service,
# repository and models; since M3/S3.2 the ingestion service, ARQ queue and
# worker; since M3/S3.3 the PDF extractor, its interface and models, and the
# extracted-page model and repository; and since M3/S3.4 the chunker, section
# detection, the tokenizer and its seam, and chunk persistence; and since
# M3/S3.5 the embedding provider, its authoritative tokenizer, the vector
# store seam and the Qdrant adapter.
# `--follow-imports=silent` limits reporting to the listed files while still
# type-checking against everything they import.
# Each later sprint adds the files it makes real.
name: Backend CI

on:
  push:
    branches: [main, "milestone/**", "sprint/**"]
  pull_request:
    branches: [main, "milestone/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Without this Poetry builds the venv under ~/.cache/pypoetry, so the cache
  # step below — which keys on .venv — would never hit.
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  backend:
    name: Lint, format, import and test
    runs-on: ubuntu-latest

    services:
      # The system of record (ADR-0003). Tests marked `db` run against a real
      # PostgreSQL and are never redirected to SQLite: the schema they will
      # carry uses JSONB, UUID and partial indexes, so a passing SQLite run
      # would say nothing about what ships.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: researchmind
          POSTGRES_PASSWORD: researchmind
          POSTGRES_DB: researchmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchmind -d researchmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The ingestion job queue (ADR-0009, M3/S3.2). Tests marked `redis` run the
      # real ARQ queue and a real worker against it — nothing about ARQ is mocked.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The vector store (ADR-0003, M3/S3.5). A container this job creates and
      # throws away — never a shared or public instance. Tests marked `qdrant`
      # build their own collection inside it and drop it, so the isolation
      # invariant is asserted against a real server rather than a mock of one.
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://researchmind:researchmind@localhost:5432/researchmind
      # Turns "database unreachable" from a skip into a failure. A skipped test
      # reports success, so without this the database coverage could disappear
      # from CI and nothing would say so.
      REQUIRE_DB: "1"
      # The same, for Redis: without it the worker tests would skip, and a
      # skipped test reports success.
      REQUIRE_REDIS: "1"
      # And for the embedding model (M3/S3.5). Its weights are fetched into the
      # cache below; without this flag a fetch that silently failed would turn
      # the provider and tokenizer tests into passes.
      REQUIRE_EMBEDDINGS: "1"
      # And for Qdrant: the tenant-isolation tests are the ones that must never
      # turn into skips.
      REQUIRE_QDRANT: "1"
      EMBEDDING_CACHE_DIR: .fastembed_cache

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Cache the embedding model's weights
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          # Keyed on the model, not the lockfile: the weights change when the
          # model does, and a Poetry upgrade should not re-download 67 MB.
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Validate pyproject
        run: poetry check

      - name: Validate lockfile is in step with pyproject
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Fetch the embedding model (ADR-0004)
        run: |
          # Prints the measured dimension, so a cache that restored something
          # unusable fails here rather than inside the test run.
          poetry run python scripts/fetch-embedding-model.py

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (black)
        run: poetry run black --check .

      - name: Type check the finished surface (mypy --strict)
        run: |
          poetry run mypy --follow-imports=silent \
            backend/security/ \
            backend/services/auth_service.py \
            backend/api/routers/auth.py \
            backend/api/routers/documents.py \
            backend/api/dependencies/services.py \
            backend/api/not_implemented.py \
            backend/api/schemas/auth.py \
            backend/db/repositories/user.py \
            shared/models/principal.py \
            shared/models/credentials.py \
            shared/models/user.py \
            backend/services/document_service.py \
            backend/db/repositories/document.py \
            backend/db/models/document.py \
            backend/api/schemas/documents.py \
            backend/storage/ \
            backend/ingestion/ \
            shared/interfaces/storage.py \
            shared/interfaces/ingestion.py \
            shared/models/ingestion.py \
            shared/models/document.py \
            document_processing/validation.py \
            backend/services/ingestion_service.py \
            document_processing/pdf_parser.py \
            shared/interfaces/pdf_extraction.py \
            shared/models/extraction.py \
            backend/db/models/document_page.py \
            backend/db/repositories/document_page.py \
            document_processing/chunker.py \
            document_processing/sections.py \
            document_processing/tokenization.py \
            shared/interfaces/chunking.py \
            shared/interfaces/tokenization.py \
            shared/models/chunking.py \
            backend/db/models/document_chunk.py \
            backend/db/repositories/document_chunk.py \
            document_processing/embedder.py \
            shared/interfaces/embedding.py \
            shared/interfaces/vector_store.py \
            vector_db/qdrant/

      - name: Assert `import mcp` resolves to the SDK, not this repository
        run: |
          # ADR-0002, the runtime half of the guard in ci-hygiene.yml. That job
          # installs nothing, so it can only assert the repository invariant (no
          # top-level mcp/). This one has dependencies installed, so it asserts
          # what actually broke before S0.2: that `import mcp` lands in the
          # installed SDK rather than a repository-local package.
          poetry run python - <<'PY'
          import pathlib
          import mcp

          resolved = pathlib.Path(mcp.__file__).resolve()
          if "site-packages" not in resolved.parts:
              raise SystemExit(f"::error::import mcp resolved to {resolved}, not the installed SDK")
          print(f"OK: import mcp -> {resolved}")
          PY

      - name: Migrations apply, reverse and re-apply
        env:
          # Settings requires it and alembic/env.py reads Settings. A dummy
          # value: nothing here calls Anthropic.
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
        run: |
          # A separate step from the tests on purpose. The suite exercises the
          # same cycle and then inspects pg_catalog, but running the CLI here
          # means a broken migration is reported as a broken migration rather
          # than as a test failure — and it still reports if collection breaks.
          #
          # A migration that cannot round-trip is not reviewable: there is no
          # way to try it, back it out and try it again.
          poetry run alembic upgrade head
          poetry run alembic check
          poetry run alembic downgrade base
          poetry run alembic upgrade head

      - name: Tests
        run: poetry run pytest -v
