# Repository hygiene — ENFORCED. These checks pass today and must keep passing.
#
# Deliberately scoped to properties that are true of the repository regardless
# of how much of the application is implemented, so this workflow is green from
# the first commit and stays green through every milestone.
name: Repository Hygiene

on:
  push:
    branches: [main, "milestone/**", "sprint/**"]
  pull_request:
    branches: [main, "milestone/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repository hygiene
        run: ./scripts/check-hygiene.sh

      - name: Secret scan (gitleaks)
        run: |
          # Installed from the release binary rather than the marketplace
          # action, which is licence-gated for organisations.
          VERSION=8.18.4
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --no-banner

      - name: Assert no package shadows the mcp SDK
        run: |
          # ADR-0002. A repository-local package named `mcp` sits ahead of
          # site-packages on sys.path and shadows the MCP SDK, which made the
          # entire MCP layer unimportable before Sprint M0/S0.2. This guard
          # exists so that collision can never be reintroduced.
          #
          # Deliberately dependency-free: this job installs nothing, so it
          # asserts the repository invariant (no top-level `mcp/`) rather than
          # runtime resolution. The runtime assertion — that `import mcp` lands
          # in site-packages — lives in Backend CI, where dependencies are
          # installed; it was added there when that workflow was promoted in
          # Sprint M0/S0.5.
          fail=0
          if [ -d mcp ]; then
            echo "::error::a top-level mcp/ directory shadows the MCP SDK (ADR-0002)"
            fail=1
          fi
          if [ ! -d mcp_server ]; then
            echo "::error::mcp_server/ is missing — the project MCP package should live there"
            fail=1
          fi
          if git grep -nE '^\s*from mcp\.(tools|resources|prompts)' -- '*.py' > /dev/null 2>&1; then
            echo "::error::stale project-local import of mcp.{tools,resources,prompts}; use mcp_server.*"
            git grep -nE '^\s*from mcp\.(tools|resources|prompts)' -- '*.py'
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "OK: no package shadows the mcp SDK" || exit 1
