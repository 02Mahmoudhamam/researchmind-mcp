# Frontend CI — ENFORCED since Sprint M0/S0.5.
#
# Sprint M0/S0.4 supplied what this workflow needs: package-lock.json (so `npm ci`
# succeeds at all), next.config.mjs, postcss.config.js, tailwind.config.ts and
# .eslintrc.json (so `npm run lint` lints instead of opening a setup prompt).
# All four steps below were verified green from a wiped node_modules before this
# trigger was promoted.
name: Frontend CI

on:
  push:
    branches: [main, "milestone/**", "sprint/**"]
  pull_request:
    branches: [main, "milestone/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
