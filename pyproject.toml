[tool.poetry]
name = "researchmind-mcp"
version = "0.1.0"
description = "AI Research Assistant based on Model Context Protocol"
authors = ["ResearchMind Team"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.111,<0.142"
uvicorn = ">=0.30,<0.53"
mcp = "^1.0.0"
anthropic = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.7.0"}
pydantic-settings = "^2.3.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.31.0"
# Declared explicitly although sqlalchemy[asyncio] already pulls it. SQLAlchemy's
# async bridge fails at runtime without greenlet, with a MissingGreenlet error
# that names neither package — an implicit transitive dependency is the wrong
# place for something load-bearing.
greenlet = "^3.0.0"
# A main dependency, not dev: `alembic upgrade head` runs as a deployment step
# against production, so it must be present in the runtime image.
alembic = "^1.13"
qdrant-client = "^1.10.0"
redis = "^5.0.0"
pymupdf = "^1.24.0"
langchain-text-splitters = "^0.2.0"
# PyJWT rather than python-jose. Both were patched at the versions pinned here,
# so this is a dependency-surface decision, not a CVE response: python-jose
# requires `ecdsa`, which carries GHSA-wj6h-64fc-37mp (high, Minerva timing
# attack, no fix planned) and which HS256 does not need at all. PyJWT was
# already present transitively via redis, so declaring it directly adds nothing
# to the image while removing ecdsa, rsa and pyasn1 from the tree.
pyjwt = "^2.13"
# bcrypt directly, not passlib. passlib has been a declared dependency since the
# scaffold and was never imported — and left to itself it would have selected a
# backend at import time, silently falling through to stdlib `crypt`, which was
# removed in Python 3.13. A password-hashing library that quietly changes
# algorithm depending on what is installed is the wrong shape for the one
# security boundary that must be predictable.
#
# The bcrypt package is a thin binding over the reference implementation. It
# generates the salt, encodes the cost in the hash, and compares in constant
# time; there is nothing left for an abstraction layer to add here.
bcrypt = "^4.2"
python-multipart = ">=0.0.9,<0.0.33"
structlog = "^24.2.0"
httpx = ">=0.27,<0.29"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
black = "^24.4.0"
ruff = ">=0.4,<0.17"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Kept in step with [tool.ruff].line-length below; if they disagree, `black`
# reformats a line and `ruff check` then reports it, and CI can never be green.
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# Without these, mypy derives two module names for the same file — `models.agent`
# and `shared.models.agent` — because shared/ and agents/ have no __init__.py
# while their subpackages do. It then aborts with "Source file found twice under
# different module names" before type-checking anything, so `mypy .` reported one
# error and checked nothing. These make the repository root the single package
# base, which is how the code is actually imported.
explicit_package_bases = true
mypy_path = "."

# NOT ENFORCED IN CI YET — scheduled for Milestone M2, per the promotion schedule
# in .github/workflows/ci-backend.yml. With the config above mypy runs properly
# and reports 149 errors in 66 files, of which 54 are `empty-body`: the ~99 stubs
# that declare a non-Optional return type and then `...`. Those are not type bugs
# to fix, they are the unimplemented system. Turning this on now would mean
# either a permanently red pipeline or blanket ignores, and both are worse than
# an honest, dated deferral.
